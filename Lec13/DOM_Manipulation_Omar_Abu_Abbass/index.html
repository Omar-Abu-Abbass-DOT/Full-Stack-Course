<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Interactive Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glass-container" id="loginBox">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Please enter your details to sign in</p>
        </div>
        
        <form id="loginForm">
            <div class="input-group">
                <i class="fas fa-user icon"></i>
                <input type="text" id="username" placeholder="Username" autocomplete="off" required>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock icon"></i>
                <input type="password" id="password" placeholder="Password" required>
                <i class="fas fa-eye toggle-password" id="toggleBtn"></i>
            </div>
            
            <button type="submit" id="loginBtn">
                <span id="btnText">Sign In</span>
                <i class="fas fa-spinner fa-spin hidden" id="spinner"></i>
            </button>
            
            <p id="message"></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
